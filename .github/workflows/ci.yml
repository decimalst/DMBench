name: Tests and data validation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python benchmark_outline.py --validate-only
      - run: python manage_dataset.py --check
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - run: python benchmark_outline.py --dry-run --output-dir reports/ci-smoke
      - run: python benchmark_outline.py --provider brev --dry-run --limit 1 --output-dir reports/brev-smoke
      - run: python benchmark_outline.py --provider bedrock --dry-run --limit 1 --output-dir reports/bedrock-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            reports/*/results.json

  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-bedrock.txt -r requirements-dev.txt
      - run: python -m pytest tests/test_sdk_contract.py tests/test_bedrock_sdk.py
